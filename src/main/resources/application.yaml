server:
  port: ${PORT:8083}
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: ia-service

  # ---------- Base de datos: Supabase Transaction Pooler ----------
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      data-source-properties:
        # Obligatorio con el Transaction Pooler: no soporta prepared statements con nombre
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Dialecto explícito + metadatos JDBC desactivados: evita que Hibernate abra una
        # conexión extra al pooler solo para autodetectar el dialecto en el arranque.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
    show-sql: false

  # ---------- Adjuntos: imágenes, audio y PDFs del chat ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

  # ---------- Redis (Upstash) para rate limiting ----------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 5s

  # ---------- Google Cloud Pub/Sub ----------
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      pubsub:
        # Apagado hasta la etapa 5 (suscripciones push para las sugerencias de cuidado):
        # hoy no hay publisher ni subscriber usándolo, así que el único efecto de dejarlo
        # encendido es cargar gRPC/Netty y resolver credenciales al arrancar.
        enabled: ${PUBSUB_ENABLED:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ---------- Configuración propia del servicio ----------
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL}
  model-fallback: ${GEMINI_MODEL_FALLBACK:gemini-3.6-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout-seconds: ${GEMINI_TIMEOUT:20}
  verification-timeout-seconds: ${GEMINI_VERIFICATION_TIMEOUT:10}
  max-retries: ${GEMINI_MAX_RETRIES:1}
  retry-backoff-ms: ${GEMINI_RETRY_BACKOFF_MS:1000}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:32768}
  max-tool-iterations: ${GEMINI_MAX_TOOL_ITERATIONS:5}
  max-history-messages: ${GEMINI_MAX_HISTORY:20}
  max-history-attachments: ${GEMINI_MAX_HISTORY_ATTACHMENTS:2}

security:
  jwt:
    jwks-uri: ${JWT_JWKS_URI}
    issuer: ${JWT_ISSUER:myanimalog-user-service}
    audience: ${JWT_AUDIENCE:myanimalog-api}

internal:
  api-key: ${INTERNAL_API_KEY}

document-analysis:
  allowed-file-hosts: ${ALLOWED_FILE_HOSTS:}
  max-file-mb: ${MAX_FILE_MB:10}
  max-pages: ${MAX_PAGES:20}
  # Default provisional (90 días): el valor real lo define el negocio, ver reporte final.
  doc-max-age-days: ${DOC_MAX_AGE_DAYS:90}
  # Presupuesto total de /internal/verification/analyze (varios documentos en paralelo),
  # no de un solo documento: Veterinary corta a los 60s.
  analysis-timeout-ms: ${ANALYSIS_TIMEOUT_MS:50000}

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  bucket: ${SUPABASE_BUCKET:ai-attachments}
  signed-url-ttl-seconds: ${SUPABASE_SIGNED_URL_TTL:3600}

uploads:
  max-files-per-request: 5
  max-total-bytes: 15728640

app:
  timezone: ${APP_TIMEZONE:America/Bogota}

services:
  gateway-url: ${GATEWAY_URL}
  pet-service-url: ${PET_SERVICE_URL:http://localhost:8081}
  medical-service-url: ${MEDICAL_SERVICE_URL:http://localhost:3000}
  calendar-service-url: ${CALENDAR_SERVICE_URL:https://calendar-microservice-20369076707.us-central1.run.app}
  timeout-seconds: ${SERVICES_TIMEOUT:10}

ratelimit:
  chat:
    requests-per-minute: ${RATELIMIT_CHAT_RPM:10}
  documents:
    requests-per-hour: ${RATELIMIT_DOCS_RPH:20}

pubsub:
  topics:
    ai-suggestion-generated: ai-suggestion-generated

# ---------- Observabilidad ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.myanimal.org: ${LOG_LEVEL:INFO}